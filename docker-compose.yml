services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=["http://localhost:3000"]
      - INSFORGE_BASE_URL=https://icxn67z7.us-east.insforge.app
      - INSFORGE_ANON_KEY=${INSFORGE_ANON_KEY:-anon_4bc36a1280391d90d9103aa5b4e50ba79b188ae70b27def01c7735cba14709d0}
    volumes:
      - ./backend:/app
      - ~/.kube/config:/app/kubeconfig-host:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_INSFORGE_BASE_URL: https://icxn67z7.us-east.insforge.app
        NEXT_PUBLIC_INSFORGE_ANON_KEY: anon_4bc36a1280391d90d9103aa5b4e50ba79b188ae70b27def01c7735cba14709d0
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
